<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGRI-CONNECT - My Orders & Deliveries</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D6C2B0; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen font-sans antialiased text-gray-800 flex" style="background-color: #F3EFEA; background-image: radial-gradient(circle at 20% 20%, rgba(249, 87, 56, 0.16) 0%, transparent 50%), radial-gradient(circle at 82% 78%, rgba(235, 74, 95, 0.14) 0%, transparent 58%);">

  <!-- Left Navigation Sidebar -->
  <aside class="w-64 bg-white/95 backdrop-blur-sm border-r border-[#E0D1C3] p-6 flex flex-col justify-between rounded-r-3xl shadow-sm z-10 flex-shrink-0 min-h-screen">
    <div>
      <!-- Brand Title -->
      <div class="px-2 py-3 mb-6">
        <h1 class="text-xl font-bold tracking-widest text-[#D97706] uppercase flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-[#F59E0B]"></span> DASHBOARD
        </h1>
      </div>

      <!-- Sidebar Navigation Links -->
      <nav class="space-y-2">
        <a href="buyerdash.html" class="w-full flex items-center gap-3 px-5 py-3.5 rounded-full text-sm font-bold tracking-wider text-gray-600 hover:bg-amber-50/60 hover:text-amber-700 uppercase transition-all">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>BUYING DESK</span>
        </a>
        <a href="farmeraddproduct.html" class="w-full flex items-center gap-3 px-5 py-3.5 rounded-full text-sm font-bold tracking-wider text-gray-600 hover:bg-amber-50/60 hover:text-amber-700 uppercase transition-all">
          <i data-lucide="shopping-cart" class="w-4 h-4"></i>
          <span>MY CART / ADD PRODUCE</span>
        </a>
        <a href="byerdel.html" class="w-full flex items-center gap-3 px-5 py-3.5 rounded-full text-sm font-bold tracking-wider bg-amber-50 text-[#B45309] shadow-sm border border-amber-200 uppercase transition-all">
          <i data-lucide="package" class="w-4 h-4"></i>
          <span>MY ORDERS</span>
        </a>
        <a href="byerprofile.html" class="w-full flex items-center gap-3 px-5 py-3.5 rounded-full text-sm font-bold tracking-wider text-gray-600 hover:bg-amber-50/60 hover:text-amber-700 uppercase transition-all">
          <i data-lucide="user-check" class="w-4 h-4"></i>
          <span>BUYER PROFILE</span>
        </a>
      </nav>
    </div>

    <!-- Footer Logout Link -->
    <div class="pt-4 border-t border-[#E0D1C3]">
      <a href="log_in.html" class="w-full flex items-center gap-3.5 px-5 py-3.5 rounded-2xl text-sm font-bold tracking-wider text-rose-600 hover:bg-rose-50 transition-all uppercase">
        <i data-lucide="log-out" class="w-5 h-5"></i>
        <span>LOG OUT</span>
      </a>
    </div>
  </aside>

  <!-- Main Content Panel -->
  <main class="flex-1 p-8 overflow-y-auto min-h-screen">
    
    <!-- Top Header Bar -->
    <header class="flex justify-between items-center mb-8">
      <div class="w-full h-[80px] bg-white/95 backdrop-blur-sm rounded-2xl shadow-sm border border-[#E0D1C3] p-4 flex items-center justify-between">
        <h2 class="text-sm font-extrabold tracking-wider uppercase flex items-center gap-1">
          <span class="text-gray-900">FARMERS</span>
          <span class="text-[#F59E0B]">MARKET</span>
        </h2>

        <div class="flex items-center gap-4">
          <span class="px-4 py-1.5 bg-[#FEF3C7] text-[#B45309] font-bold text-xs tracking-wider rounded-full uppercase border border-amber-200">
            LIVE
          </span>
          <div class="w-10 h-10 rounded-full bg-[#B91C1C] flex items-center justify-center text-white font-bold text-sm shadow-sm cursor-pointer hover:opacity-90 transition-opacity">
            <i data-lucide="user" class="w-5 h-5"></i>
          </div>
        </div> 
      </div>
    </header>

    <!-- Section 1: Out for Delivery Orders -->
    <div class="mb-10">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h3 class="text-xl font-bold text-gray-900 flex items-center gap-2">
            <i data-lucide="truck" class="w-5 h-5 text-amber-600"></i> Out for Delivery
          </h3>
          <p class="text-xs text-gray-500">Live shipments currently on their way to your location.</p>
        </div>
      </div>
      <div id="outForDeliveryContainer"></div>
    </div>

    <!-- Section 2: Previous / Past Deliveries -->
    <div>
      <div class="flex justify-between items-center mb-4">
        <div>
          <h3 class="text-xl font-bold text-gray-900 flex items-center gap-2">
            <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600"></i> Previous Deliveries
          </h3>
          <p class="text-xs text-gray-500">History of your completed and delivered produce orders.</p>
        </div>
      </div>
      <div id="previousDeliveryContainer"></div>
    </div>

  </main>

  <script>
    lucide.createIcons();

    function renderOrders() {
      const orders = JSON.parse(localStorage.getItem('agriOrders') || '[]');
      const outContainer = document.getElementById('outForDeliveryContainer');
      const prevContainer = document.getElementById('previousDeliveryContainer');

      const outForDelivery = orders.filter(o => o.status === 'Out for Delivery');
      const previousDeliveries = orders.filter(o => o.status === 'Delivered');

      // Render Out for Delivery
      if (outForDelivery.length === 0) {
        outContainer.innerHTML = `
          <div class="bg-white rounded-3xl p-8 border border-amber-100 text-center shadow-sm">
            <div class="w-12 h-12 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center mx-auto mb-3 border border-amber-100">
              <i data-lucide="truck" class="w-6 h-6"></i>
            </div>
            <h4 class="text-sm font-bold text-gray-800 mb-1">No Active Deliveries</h4>
            <p class="text-xs text-gray-400">You don't have any orders currently out for delivery.</p>
          </div>
        `;
      } else {
        let html = `<div class="bg-white rounded-3xl border border-amber-100 shadow-sm overflow-hidden divide-y divide-amber-100/60">`;
        outForDelivery.forEach((item) => {
          // Find original index in full orders array
          const globalIdx = orders.findIndex(o => o.id === item.id);
          html += `
            <div class="p-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 hover:bg-amber-50/20 transition-colors">
              <div class="flex items-center gap-4">
                <img src="${item.image}" alt="${item.title}" class="w-16 h-16 rounded-2xl object-cover border border-amber-100 shadow-sm">
                <div>
                  <div class="flex items-center gap-2 mb-1">
                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold text-amber-800 bg-amber-100 uppercase">Out for Delivery</span>
                    <span class="text-xs text-gray-400">Ordered on ${item.orderDate}</span>
                  </div>
                  <h4 class="font-bold text-gray-900 text-sm">${item.title}</h4>
                  <p class="text-xs text-gray-400">${item.farmer} · ${item.location}</p>
                </div>
              </div>

              <div class="flex items-center gap-6 w-full md:w-auto justify-between md:justify-end">
                <div class="text-right">
                  <p class="text-xs text-gray-400">Qty: <span class="font-bold text-gray-800">${item.quantity} ${item.unit}</span></p>
                  <p class="text-sm font-black text-gray-900">₹${item.totalPrice}</p>
                </div>
                <button onclick="markAsDelivered(${globalIdx})" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-1.5">
                  <i data-lucide="check" class="w-3.5 h-3.5"></i> Mark Delivered
                </button>
              </div>
            </div>
          `;
        });
        html += `</div>`;
        outContainer.innerHTML = html;
      }

      // Render Previous Deliveries
      if (previousDeliveries.length === 0) {
        prevContainer.innerHTML = `
          <div class="bg-white rounded-3xl p-8 border border-amber-100 text-center shadow-sm">
            <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-3 border border-emerald-100">
              <i data-lucide="check-circle-2" class="w-6 h-6"></i>
            </div>
            <h4 class="text-sm font-bold text-gray-800 mb-1">No Previous Deliveries</h4>
            <p class="text-xs text-gray-400">Completed deliveries will appear here.</p>
          </div>
        `;
      } else {
        let html = `<div class="bg-white rounded-3xl border border-amber-100 shadow-sm overflow-hidden divide-y divide-amber-100/60">`;
        previousDeliveries.forEach((item) => {
          html += `
            <div class="p-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 hover:bg-emerald-50/10 transition-colors">
              <div class="flex items-center gap-4">
                <img src="${item.image}" alt="${item.title}" class="w-16 h-16 rounded-2xl object-cover border border-amber-100 shadow-sm">
                <div>
                  <div class="flex items-center gap-2 mb-1">
                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold text-emerald-800 bg-emerald-100 uppercase">Delivered</span>
                    <span class="text-xs text-gray-400">Ordered on ${item.orderDate}</span>
                  </div>
                  <h4 class="font-bold text-gray-900 text-sm">${item.title}</h4>
                  <p class="text-xs text-gray-400">${item.farmer} · ${item.location}</p>
                </div>
              </div>

              <div class="text-right">
                <p class="text-xs text-gray-400">Qty: <span class="font-bold text-gray-800">${item.quantity} ${item.unit}</span></p>
                <p class="text-sm font-black text-gray-900">₹${item.totalPrice}</p>
              </div>
            </div>
          `;
        });
        html += `</div>`;
        prevContainer.innerHTML = html;
      }

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function markAsDelivered(index) {
      let orders = JSON.parse(localStorage.getItem('agriOrders') || '[]');
      if (orders[index]) {
        orders[index].status = 'Delivered';
        localStorage.setItem('agriOrders', JSON.stringify(orders));
        renderOrders();
      }
    }

    renderOrders();
  </script>
</body>
</html>
