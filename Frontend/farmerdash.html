<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGRI-CONNECT - Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#E8F5E9] via-[#F4F9F4] to-[#E2EAF4] font-sans antialiased text-gray-800">

  <div class="flex min-h-screen">
    
    <!-- Left Navigation Sidebar -->
    <aside class="w-72 bg-white/95 backdrop-blur-md border-r border-emerald-900/10 p-6 flex flex-col justify-between rounded-r-3xl shadow-sm z-10 flex-shrink-0">
      <div>
        <!-- Brand Title with Previous Light Blue Color -->
        <div class="px-2 py-3 mb-6">
          <h1 class="text-xl font-bold tracking-widest text-[#5C94E5] uppercase flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-600"></span> DASHBOARD
          </h1>
        </div>

        <!-- Sidebar Navigation -->
        <nav id="sidebarNav" class="space-y-2">
          <!-- Navigation buttons render dynamically -->
        </nav>
      </div>

      <!-- Footer Logout Link -->
      <div class="pt-4 border-t border-gray-100">
        <a 
          id="logoutBtn"
          href="login.html" 
          class="w-full flex items-center gap-3.5 px-5 py-3.5 rounded-2xl text-sm font-bold tracking-wider text-emerald-700 hover:bg-emerald-50 transition-all uppercase"
        >
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span>LOG OUT</span>
        </a>
      </div>
    </aside>

    <!-- Main Content Panel -->
    <main class="flex-1 p-8 overflow-y-auto">
      
      <!-- Top Action Bar -->
     <header class="flex justify-between items-center mb-6">
        <div class="w-full h-[90px] bg-white rounded-2xl shadow-md text-gray-800 p-4 flex items-center justify-between border border-gray-100">
          <h2 id="roleHeader" class="text-sm font-extrabold text-[#1F2937] tracking-wider uppercase">
            FARMERS <span class="text-[#659F68]">MARKET</span> 
          </h2>

          <!-- Right side items: Badge + Avatar -->
          <div class="flex items-center gap-3">
            <span class="px-3 py-1 bg-[#FDF0C3] text-[#8D6B00] font-bold text-xs tracking-wider rounded-full shadow-sm uppercase border border-amber-200">
              LIVE
            </span>
            <div class="w-9 h-9 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold text-sm shadow-sm cursor-pointer hover:bg-emerald-700 transition-colors">
              <i data-lucide="user" class="w-5 h-5"></i>
            </div>
          </div> 

        </div>
      </header>

      <!-- Dynamic Screen Container -->
      <div id="screenContainer">
        <!-- Rendered via JavaScript -->
      </div>

    </main>

  </div>

  <script>
    // Navigation items with custom href links (Internal HTML pages or External URLs)
    const navItems = [
      { id: 'dashboard', label: 'DASHBOARD', icon: 'layout-dashboard', href: '#' },
      { id: 'add-produce', label: 'ADD PRODUCE', icon: 'plus-circle', href: 'farmadd-produce.html' },
      { id: 'my-produce', label: 'MY PRODUCE', icon: 'package', href: 'farmmy-produce.html' },
      { id: 'orders', label: 'ORDERS', icon: 'clipboard-list', href: 'farmorders.html' },
      { id: 'contracts', label: 'CONTRACTS', icon: 'file-text', href: 'farmcontracts.html' },
      { id: 'payments', label: 'PAYMENTS', icon: 'credit-card', href: 'farmpayments.html' },
      { id: 'logistics', label: 'LOGISTICS', icon: 'truck', href: 'farmlogistics.html' },
      { id: 'profile', label: 'PROFILE', icon: 'user', href: 'farmprofile.html' },
    ];

    // External URL configuration for Logout
    const logoutUrl = 'log_in.html';

    // Read active role parameters passed from login.html
    const urlParams = new URLSearchParams(window.location.search);
    const activeRole = urlParams.get('role') || localStorage.getItem('agri_role') || 'farmers';
    let currentTab = 'dashboard';

    // Render Sidebar Navigation
    function renderSidebar() {
      const navContainer = document.getElementById('sidebarNav');
      navContainer.innerHTML = '';

      navItems.forEach(item => {
        const isActive = item.id === currentTab;
        const link = document.createElement('a');
        
        link.href = item.href;
        
        // Open external links in a new tab if they start with http/https
        if (item.href.startsWith('http://') || item.href.startsWith('https://')) {
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
        }

        // Handle internal tab switching if href is '#'
        if (item.href === '#') {
          link.onclick = (e) => {
            e.preventDefault();
            switchTab(item.id);
          };
        }

        link.className = `w-full flex items-center gap-3 px-5 py-3.5 rounded-full text-sm font-bold tracking-wider transition-all uppercase ${
          isActive 
            ? 'bg-[#FDF0C3] text-[#5C94E5] shadow-sm border border-amber-200/60' 
            : 'text-gray-700 hover:bg-emerald-50 hover:text-[#5C94E5]'
        }`;

        link.innerHTML = `
          <i data-lucide="${item.icon}" class="w-4 h-4"></i>
          <span>${item.label}</span>
        `;
        navContainer.appendChild(link);
      });

      // Update Logout button href link
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.href = logoutUrl;
        logoutBtn.onclick = () => {
          localStorage.removeItem('agri_role');
          localStorage.removeItem('agri_user');
        };
      }
    }

    // Tab Switch Router
    function switchTab(tabId) {
      currentTab = tabId;
      renderSidebar();
      
      const container = document.getElementById('screenContainer');

      if (tabId === 'dashboard') {
        renderDashboardHome(container);
      } else {
        const matched = navItems.find(i => i.id === tabId);
        container.innerHTML = `
          <div class="bg-white/90 backdrop-blur-sm p-8 rounded-3xl border border-gray-100 shadow-sm">
            <h3 class="text-xl font-bold text-[#5C94E5] uppercase tracking-wide mb-2">${matched ? matched.label : tabId}</h3>
            <p class="text-sm text-gray-500">This module handles ${matched ? matched.label.toLowerCase() : tabId} management for your agricultural workspace.</p>
          </div>
        `;
      }
      
      // Trigger icon replacement AFTER the container and sidebar are fully populated
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    // Render Dashboard Cards View
    function renderDashboardHome(container) {
      container.innerHTML = `
        <!-- Welcome Header Banner -->
        <div class="bg-[#FDF7EE] p-6 rounded-3xl border border-amber-100 mb-6 shadow-sm relative overflow-hidden">
          <div class="flex flex-col lg:flex-row gap-6 items-center justify-between relative z-10">
            <div>
              <p class="text-xs font-bold tracking-widest text-[#5C94E5] uppercase mb-1">YOUR FARM, CONNECTED</p>
              <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">Grow your reach. Keep your value.</h1>
              <p class="text-sm text-gray-500 mt-1">Your transparent selling pipeline at a glance.</p>
            </div>
            
            <!-- Farm Image -->
            <div class="w-full lg:w-80 h-36 rounded-2xl overflow-hidden shadow-md border border-white flex-shrink-0 relative group">
              <img src="https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=800&q=80" alt="Farm Landscape" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
              <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent pointer-events-none"></div>
              <span class="absolute bottom-2.5 left-2.5 text-white text-[11px] font-bold bg-black/40 backdrop-blur-sm px-2 py-0.5 rounded-md">Live Harvest Field</span>
            </div>
          </div>
        </div>

        <!-- 6 Metrics Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          
          <!-- Card 1 -->
          <div class="bg-white p-6 rounded-3xl border border-gray-100 hover:border-gray-200 transition-all shadow-sm flex flex-col justify-between">
            <div>
              <div class="w-10 h-10 rounded-2xl bg-[#FDF0C3] text-emerald-700 flex items-center justify-center mb-4 border border-amber-200">
                <i data-lucide="package" class="w-5 h-5"></i>
              </div>
              <p class="text-xs font-medium text-gray-500 mb-1">Total listings</p>
              <h3 class="text-3xl font-black text-gray-900">1</h3>
            </div>
            <p class="text-xs font-bold text-[#5C94E5] mt-4">+1 this month</p>
          </div>

          <!-- Card 2 -->
          <div class="bg-white p-6 rounded-3xl border border-gray-100 hover:border-gray-200 transition-all shadow-sm flex flex-col justify-between">
            <div>
              <div class="w-10 h-10 rounded-2xl bg-[#FDF0C3] text-emerald-700 flex items-center justify-center mb-4 border border-amber-200">
                <i data-lucide="clipboard-check" class="w-5 h-5"></i>
              </div>
              <p class="text-xs font-medium text-gray-500 mb-1">Active orders</p>
              <h3 class="text-3xl font-black text-gray-900">0</h3>
            </div>
            <p class="text-xs font-bold text-[#5C94E5] mt-4">Live pipeline</p>
          </div>

          <!-- Card 3 -->
          <div class="bg-white p-6 rounded-3xl border border-gray-100 hover:border-gray-200 transition-all shadow-sm flex flex-col justify-between">
            <div>
              <div class="w-10 h-10 rounded-2xl bg-[#FDF0C3] text-emerald-700 flex items-center justify-center mb-4 border border-amber-200">
                <i data-lucide="shield-check" class="w-5 h-5"></i>
              </div>
              <p class="text-xs font-medium text-gray-500 mb-1">Pending escrow</p>
              <h3 class="text-3xl font-black text-gray-900">₹0</h3>
            </div>
            <p class="text-xs font-bold text-[#5C94E5] mt-4 uppercase">DEMO ESCROW</p>
          </div>

          <!-- Card 4 -->
          <div class="bg-white p-6 rounded-3xl border border-gray-100 hover:border-gray-200 transition-all shadow-sm flex flex-col justify-between">
            <div>
              <div class="w-10 h-10 rounded-2xl bg-[#FDF0C3] text-emerald-700 flex items-center justify-center mb-4 border border-amber-200">
                <i data-lucide="indian-rupee" class="w-5 h-5"></i>
              </div>
              <p class="text-xs font-medium text-gray-500 mb-1">Total earnings</p>
              <h3 class="text-3xl font-black text-gray-900">₹0</h3>
            </div>
            <p class="text-xs font-bold text-[#5C94E5] mt-4">Released payments</p>
          </div>

          <!-- Card 5 -->
          <div class="bg-white p-6 rounded-3xl border border-gray-100 hover:border-gray-200 transition-all shadow-sm flex flex-col justify-between">
            <div>
              <div class="w-10 h-10 rounded-2xl bg-[#FDF0C3] text-emerald-700 flex items-center justify-center mb-4 border border-amber-200">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
              </div>
              <p class="text-xs font-medium text-gray-500 mb-1">Average AI quality</p>
              <h3 class="text-3xl font-black text-gray-900">92/100</h3>
            </div>
            <p class="text-xs font-bold text-[#5C94E5] mt-4">Across your produce</p>
          </div>

          <!-- Card 6 -->
          <div class="bg-white p-6 rounded-3xl border border-gray-100 hover:border-gray-200 transition-all shadow-sm flex flex-col justify-between">
            <div>
              <div class="w-10 h-10 rounded-2xl bg-[#FDF0C3] text-emerald-700 flex items-center justify-center mb-4 border border-amber-200">
                <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
              </div>
              <p class="text-xs font-medium text-gray-500 mb-1">Avg. selling price</p>
              <h3 class="text-3xl font-black text-gray-900">₹35<span class="text-base font-normal text-gray-500">/kg</span></h3>
            </div>
            <p class="text-xs font-bold text-[#5C94E5] mt-4">Fair price signal</p>
          </div>

        </div>
      `;
    }

    // Initialize View
    document.getElementById('roleHeader').innerHTML = `${activeRole.toUpperCase()} <span class="text-[#659F68]">MARKET</span>`;
    switchTab('dashboard');
  </script>
</body>
</html>
