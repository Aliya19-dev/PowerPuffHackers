<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGRI-CONNECT - Orders & Sales</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#E8F5E9] via-[#F4F9F4] to-[#E2EAF4] font-sans antialiased text-gray-800 p-4 flex gap-4">

  <!-- Left Navigation Sidebar -->
  <aside class="w-72 bg-white/95 backdrop-blur-md border border-emerald-900/10 p-6 flex flex-col justify-between rounded-3xl shadow-sm z-10 shrink-0 min-h-[calc(100vh-2rem)]">
    <div>
      <!-- Brand Title Header -->
      <div class="px-2 py-3 mb-6">
        <h1 class="text-xl font-bold tracking-widest text-[#5292EA] uppercase flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-emerald-600 inline-block"></span> 
          <span></span><span class="text-[#3B82F6]">DASHBOARD</span>
        </h1>
      </div>

      <!-- Sidebar Navigation -->
      <nav id="sidebarNav" class="space-y-2">
        <!-- Rendered dynamically -->
      </nav>
    </div>

    <!-- Footer Logout Link -->
    <div class="pt-4 border-t border-gray-100">
      <a 
        id="logoutBtn"
        href="login.html" 
        class="w-full flex items-center gap-3 px-5 py-3.5 rounded-full text-xs font-bold tracking-wider text-emerald-700 hover:bg-emerald-50 transition-all uppercase"
      >
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span>LOG OUT</span>
      </a>
    </div>
  </aside>

  <!-- Main Content Panel -->
  <div class="flex-1 flex flex-col gap-4 min-w-0">
    
    <!-- Top Action Bar -->
    <header class="bg-white/95 backdrop-blur-md rounded-2xl px-8 py-5 flex items-center justify-between shadow-sm border border-gray-100">
      <h2 id="roleHeader" class="text-sm font-extrabold tracking-wider uppercase">
        <span class="text-[#1F2937]">Farmers</span> <span class="text-[#659F68]">Market</span>
      </h2>
      
      <div class="flex items-center gap-3">
        <span class="bg-[#FDF0C3] text-[#8D6B00] border border-amber-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-sm">
          LIVE
        </span>
        <a href="farmprofile.html" class="w-9 h-9 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-sm shadow-sm cursor-pointer hover:bg-emerald-700 transition-colors">
          <i data-lucide="user" class="w-5 h-5"></i>
        </a>
      </div> 
    </header>

    <!-- Content Workspace Card -->
    <section class="flex-1 bg-white/95 backdrop-blur-md rounded-3xl p-8 flex flex-col shadow-sm border border-gray-100 min-h-[500px]">
      
      <!-- Orders Section Header -->
      <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <span class="text-xs font-bold tracking-wider text-[#5292EA] uppercase">TRANSACTIONS</span>
          <h1 class="text-2xl font-black text-gray-900 mt-1">Orders & Sales</h1>
          <p class="text-sm text-gray-500 mt-0.5">Track incoming purchases, transit milestones, and fulfilled orders.</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="bg-[#FDF0C3] text-[#8D6B00] border border-amber-200 text-xs font-bold px-4 py-2 rounded-full uppercase tracking-wider shadow-sm">
            6 Active Records
          </span>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="mb-6 border-b border-gray-100">
        <div class="flex gap-8 text-sm font-bold">
          <button onclick="switchFilter('all')" id="tab-all" class="pb-3 text-[#5292EA] border-b-2 border-[#5292EA] transition-all">
            All orders (6)
          </button>
          <button onclick="switchFilter('pending')" id="tab-pending" class="pb-3 text-gray-400 hover:text-gray-600 transition-all">
            Pending (2)
          </button>
          <button onclick="switchFilter('intransit')" id="tab-intransit" class="pb-3 text-gray-400 hover:text-gray-600 transition-all">
            In transit (2)
          </button>
          <button onclick="switchFilter('completed')" id="tab-completed" class="pb-3 text-gray-400 hover:text-gray-600 transition-all">
            Completed (2)
          </button>
        </div>
      </div>

      <!-- Main Display View Container -->
      <div id="ordersContainer" class="flex-1">
        <!-- Rendered via JavaScript -->
      </div>

    </section>

  </div>

  <script>
    // Sidebar Navigation Array
    const navItems = [
      { id: 'dashboard', label: 'DASHBOARD', icon: 'layout-dashboard', href: 'farmerdash.html' },
      { id: 'add-produce', label: 'ADD PRODUCE', icon: 'plus-circle', href: 'farmadd-produce.html' },
      { id: 'my-produce', label: 'MY PRODUCE', icon: 'package', href: 'farmmy-produce.html' },
      { id: 'orders', label: 'ORDERS', icon: 'clipboard-list', href: 'farmorders.html' },
      { id: 'contracts', label: 'CONTRACTS', icon: 'file-text', href: 'farmcontracts.html' },
      { id: 'payments', label: 'PAYMENTS', icon: 'credit-card', href: 'farmpayments.html' },
      { id: 'logistics', label: 'LOGISTICS', icon: 'truck', href: 'farmlogistics.html' },
      { id: 'profile', label: 'PROFILE', icon: 'user', href: 'farmprofile.html' },
    ];

    // 6 Full Order Dataset (2 Pending, 2 In Transit, 2 Completed)
    const ordersData = [
      {
        id: '#ORD-8941',
        produceName: 'Fresh Organic Tomatoes',
        buyerName: 'Greenline Traders',
        quantity: '200 kg',
        amount: '₹8,000',
        date: 'Sep 12, 2026',
        status: 'pending',
        badgeBg: 'bg-amber-100',
        badgeText: 'text-amber-700',
        icon: 'clock',
        iconBg: 'bg-amber-50',
        iconColor: 'text-amber-600'
      },
      {
        id: '#ORD-8942',
        produceName: 'Green Okra (Lady Finger)',
        buyerName: 'Goa Fresh Mart',
        quantity: '90 kg',
        amount: '₹4,500',
        date: 'Sep 11, 2026',
        status: 'pending',
        badgeBg: 'bg-amber-100',
        badgeText: 'text-amber-700',
        icon: 'clock',
        iconBg: 'bg-amber-50',
        iconColor: 'text-amber-600'
      },
      {
        id: '#ORD-8943',
        produceName: 'Purple Brinjal (Eggplant)',
        buyerName: 'Coastal Co-op Stores',
        quantity: '150 kg',
        amount: '₹6,200',
        date: 'Sep 10, 2026',
        status: 'intransit',
        badgeBg: 'bg-blue-100',
        badgeText: 'text-[#5292EA]',
        icon: 'truck',
        iconBg: 'bg-blue-50',
        iconColor: 'text-[#5292EA]'
      },
      {
        id: '#ORD-8944',
        produceName: 'Red Onions (Grade A)',
        buyerName: 'Apex Organics Ltd',
        quantity: '300 kg',
        amount: '₹12,000',
        date: 'Sep 09, 2026',
        status: 'intransit',
        badgeBg: 'bg-blue-100',
        badgeText: 'text-[#5292EA]',
        icon: 'truck',
        iconBg: 'bg-blue-50',
        iconColor: 'text-[#5292EA]'
      },
      {
        id: '#ORD-8945',
        produceName: 'Fresh Potato Batch',
        buyerName: 'Sahyadri Supermarket',
        quantity: '500 kg',
        amount: '₹15,000',
        date: 'Sep 05, 2026',
        status: 'completed',
        badgeBg: 'bg-emerald-100',
        badgeText: 'text-emerald-700',
        icon: 'check-circle-2',
        iconBg: 'bg-emerald-50',
        iconColor: 'text-emerald-600'
      },
      {
        id: '#ORD-8946',
        produceName: 'Sweet Sweet Corn Cobs',
        buyerName: 'Metro Wholesale Hub',
        quantity: '120 kg',
        amount: '₹5,400',
        date: 'Sep 02, 2026',
        status: 'completed',
        badgeBg: 'bg-emerald-100',
        badgeText: 'text-emerald-700',
        icon: 'check-circle-2',
        iconBg: 'bg-emerald-50',
        iconColor: 'text-emerald-600'
      }
    ];

    let currentTab = 'all';

    // Render Sidebar matching the consistent theme & hover styling
    function renderSidebar() {
      const navContainer = document.getElementById('sidebarNav');
      navContainer.innerHTML = '';

      navItems.forEach(item => {
        const isActive = item.id === 'orders';
        const link = document.createElement('a');
        link.href = item.href;

        if (isActive) {
          link.className = "w-full flex items-center gap-3 px-5 py-3.5 rounded-full text-xs font-bold tracking-wider bg-[#FDF0C3] text-[#5292EA] shadow-sm border border-amber-200/60 uppercase";
        } else {
          link.className = "w-full flex items-center gap-3 px-5 py-3.5 rounded-full text-xs font-bold tracking-wider text-gray-700 hover:bg-emerald-50 hover:text-[#5292EA] transition-all uppercase";
        }

        link.innerHTML = `
          <i data-lucide="${item.icon}" class="w-4 h-4"></i>
          <span>${item.label}</span>
        `;
        navContainer.appendChild(link);
      });

      lucide.createIcons();
    }

    // Tab Filter Switcher
    function switchFilter(tab) {
      currentTab = tab;
      
      const tabs = ['all', 'pending', 'intransit', 'completed'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = "pb-3 text-[#5292EA] border-b-2 border-[#5292EA] transition-all";
        } else {
          btn.className = "pb-3 text-gray-400 hover:text-gray-600 transition-all";
        }
      });

      renderOrdersView();
    }

    // Render Orders Cards View with matching clean container design
    function renderOrdersView() {
      const container = document.getElementById('ordersContainer');

      const filtered = ordersData.filter(item => {
        if (currentTab === 'all') return true;
        return item.status === currentTab;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="w-full bg-white border-2 border-dashed border-gray-200 rounded-3xl p-16 flex flex-col items-center justify-center text-center shadow-sm min-h-[380px]">
            <div class="w-14 h-14 rounded-2xl bg-gray-50 flex items-center justify-center text-gray-400 mb-4 shadow-sm">
              <i data-lucide="clipboard-check" class="w-7 h-7"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">No orders in this view</h3>
            <p class="text-sm text-gray-400 max-w-md">
              There are no sales orders matching your selected status filter right now.
            </p>
          </div>
        `;
      } else {
        container.innerHTML = `<div class="space-y-4">` + filtered.map(order => `
          <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm hover:border-gray-200 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 rounded-2xl ${order.iconBg} ${order.iconColor} flex items-center justify-center font-bold shrink-0">
                <i data-lucide="${order.icon}" class="w-6 h-6"></i>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-xs font-black text-[#5292EA]">${order.id}</span>
                  <span class="${order.badgeBg} ${order.badgeText} text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                    ${order.status === 'intransit' ? 'In Transit' : order.status}
                  </span>
                </div>
                <h4 class="font-bold text-gray-900 mt-0.5">${order.produceName}</h4>
                <p class="text-xs text-gray-400 mt-0.5">${order.buyerName} · <span class="font-semibold text-gray-700">${order.quantity}</span></p>
              </div>
            </div>

            <div class="flex sm:flex-col items-between sm:items-end justify-between border-t sm:border-t-0 pt-3 sm:pt-0 border-gray-100">
              <span class="text-xl font-black text-gray-900">${order.amount}</span>
              <p class="text-xs font-medium text-gray-400">${order.date}</p>
            </div>

          </div>
        `).join('') + `</div>`;
      }

      lucide.createIcons();
    }

    // Initialize Page
    renderSidebar();
    renderOrdersView();
  </script>
</body>
</html>
